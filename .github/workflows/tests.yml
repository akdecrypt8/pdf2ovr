name: tests-and-package-validation

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package, test, and packaging dependencies
        run: python -m pip install -e ".[test]" build twine
      - name: Run complete test suite
        run: python -m pytest -q -ra --junitxml=junit.xml
      - name: Fail if any test was skipped
        run: python -c "import xml.etree.ElementTree as ET; root=ET.parse('junit.xml').getroot(); skipped=sum(int(node.attrib.get('skipped', '0')) for node in root.iter('testsuite')); print(f'Skipped tests: {skipped}'); raise SystemExit(1 if skipped else 0)"
      - name: Build source and wheel distributions
        run: python -m build --no-isolation
      - name: Validate distribution metadata
        run: python -m twine check dist/*
