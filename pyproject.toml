[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf2ovr"
version = "0.6.0"
description = "Experimental toolkit for inspecting and editing selected ERDAS HFA/EANT overlays, with PDF extraction and GeoPDF georeferencing"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "akdecrypt8" }]
keywords = [
    "erdas-imagine",
    "ehfa",
    "hfa",
    "eant",
    "geopdf",
    "gis",
    "pdf-extraction",
]
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/akdecrypt8/pdf2ovr"
Repository = "https://github.com/akdecrypt8/pdf2ovr"
Documentation = "https://github.com/akdecrypt8/pdf2ovr/tree/main/docs"
Issues = "https://github.com/akdecrypt8/pdf2ovr/issues"
Changelog = "https://github.com/akdecrypt8/pdf2ovr/blob/main/CHANGELOG.md"

[project.optional-dependencies]
pdf = ["PyMuPDF>=1.24"]
geo = ["pypdf>=5.0", "pyproj>=3.6"]
test = ["pytest>=8.0", "PyMuPDF>=1.24", "pypdf>=5.0", "pyproj>=3.6", "tomli>=2; python_version < '3.11'"]

[project.scripts]
pdf2ovr = "pdf2ovr.cli:main"

[tool.setuptools.packages.find]
include = ["pdf2ovr*", "ovr_map_generator*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
